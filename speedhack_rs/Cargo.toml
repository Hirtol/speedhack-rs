[package]
name = "speedhack_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
simplelog = "0.12"
eyre.workspace = true
arc-swap = "1"

retour = { version = "0.4.0-alpha.4", features = ["static-detour"] }

rust_hooking_utils.workspace = true

windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Media_Multimedia"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Media_Multimedia"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"